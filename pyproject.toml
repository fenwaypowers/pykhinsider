[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pykhinsider"
version = "2.2.1"
description = "Download albums and tracks from KHInsider"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "Fenway Powers" }
]

dependencies = [
    "requests",
    "beautifulsoup4",
]

[project.scripts]
pykhinsider = "pykhinsider.cli:main"

[project.urls]
Repository = "https://github.com/fenwaypowers/pykhinsider"
Issues = "https://github.com/fenwaypowers/pykhinsider/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
